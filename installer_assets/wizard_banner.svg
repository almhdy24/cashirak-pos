<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="terminalBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="164" height="314" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40"  x2="164" y2="40"/>
    <line x1="0" y1="80"  x2="164" y2="80"/>
    <line x1="0" y1="120" x2="164" y2="120"/>
    <line x1="0" y1="160" x2="164" y2="160"/>
    <line x1="0" y1="200" x2="164" y2="200"/>
    <line x1="0" y1="240" x2="164" y2="240"/>
    <line x1="0" y1="280" x2="164" y2="280"/>
    <line x1="40"  y1="0" x2="40"  y2="314"/>
    <line x1="82"  y1="0" x2="82"  y2="314"/>
    <line x1="124" y1="0" x2="124" y2="314"/>
  </g>

  <!-- Top brand strip -->
  <rect x="0" y="0" width="164" height="4" fill="#2563eb"/>

  <!-- Logo mark — stylised "C" cash register icon -->
  <g transform="translate(82,38)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.9"/>
    <!-- POS symbol: screen rect + base -->
    <rect x="-9" y="-11" width="18" height="13" rx="2" fill="#2563eb" opacity="0.9"/>
    <rect x="-5" y="2"  width="10" height="2"  rx="1" fill="#2563eb" opacity="0.9"/>
    <rect x="-7" y="4"  width="14" height="3"  rx="1" fill="#2563eb" opacity="0.9"/>
    <!-- Screen shine -->
    <rect x="-7" y="-9" width="14" height="9"  rx="1.5" fill="#1e3a8a" opacity="0.7"/>
    <!-- Screen content dots -->
    <line x1="-4" y1="-6" x2="4" y2="-6" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="2" y2="-4" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-2" x2="4" y2="-2" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- App name -->
  <text x="82" y="74" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">كاشيراك</text>
  <text x="82" y="88" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="8" fill="#7dd3fc" letter-spacing="2">CASHIRAK POS</text>

  <!-- Divider -->
  <line x1="32" y1="98" x2="132" y2="98" stroke="#2563eb" stroke-width="1" opacity="0.6"/>

  <!-- ── POS Terminal Illustration ── -->
  <!-- Monitor stand -->
  <rect x="74" y="200" width="16" height="8"  rx="2" fill="#334155"/>
  <rect x="66" y="208" width="32" height="4"  rx="2" fill="#334155"/>

  <!-- Monitor body -->
  <rect x="30" y="118" width="104" height="82" rx="6" fill="url(#terminalBody)" stroke="#334155" stroke-width="1.5"/>

  <!-- Screen bezel -->
  <rect x="36" y="124" width="92" height="68" rx="4" fill="#0f172a"/>

  <!-- Screen content (blue glow) -->
  <rect x="38" y="126" width="88" height="64" rx="3" fill="url(#screenGlow)" opacity="0.9"/>

  <!-- Receipt icon on screen -->
  <g transform="translate(82,158)" filter="url(#glow)">
    <!-- Receipt body -->
    <rect x="-16" y="-20" width="32" height="38" rx="2" fill="#ffffff" opacity="0.95"/>
    <!-- Jagged top -->
    <polyline points="-16,-20 -12,-24 -8,-20 -4,-24 0,-20 4,-24 8,-20 12,-24 16,-20"
              fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <!-- Receipt lines -->
    <line x1="-11" y1="-13" x2="11"  y2="-13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-11" y1="-8"  x2="5"   y2="-8"  stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-11" y1="-3"  x2="8"   y2="-3"  stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-11" y1="2"   x2="6"   y2="2"   stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Total line -->
    <line x1="-11" y1="8"   x2="11"  y2="8"   stroke="#64748b" stroke-width="0.8"/>
    <line x1="-11" y1="12"  x2="11"  y2="12"  stroke="#1d4ed8" stroke-width="2"   stroke-linecap="round"/>
    <!-- Price dot -->
    <circle cx="9" cy="-13" r="2.5" fill="#2563eb"/>
  </g>

  <!-- Keyboard strip under monitor -->
  <rect x="42" y="204" width="80" height="10" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Key dots -->
  <g fill="#475569">
    <rect x="47" y="207" width="6" height="4" rx="1"/>
    <rect x="56" y="207" width="6" height="4" rx="1"/>
    <rect x="65" y="207" width="6" height="4" rx="1"/>
    <rect x="74" y="207" width="14" height="4" rx="1"/>
    <rect x="91" y="207" width="6" height="4" rx="1"/>
    <rect x="100" y="207" width="6" height="4" rx="1"/>
    <rect x="109" y="207" width="6" height="4" rx="1"/>
  </g>

  <!-- ── Coins / Cash below terminal ── -->
  <g transform="translate(82,228)">
    <!-- Coin stack shadow -->
    <ellipse cx="0" cy="6" rx="14" ry="4" fill="#000" opacity="0.25"/>
    <!-- Coins -->
    <ellipse cx="0" cy="4"  rx="14" ry="4.5" fill="#b45309"/>
    <ellipse cx="0" cy="2"  rx="14" ry="4.5" fill="#d97706"/>
    <ellipse cx="0" cy="0"  rx="14" ry="4.5" fill="#f59e0b"/>
    <ellipse cx="0" cy="0"  rx="14" ry="4.5" fill="none" stroke="#fbbf24" stroke-width="0.8"/>
    <!-- SDG text on coin -->
    <text x="0" y="3" text-anchor="middle" font-family="Arial,sans-serif"
          font-size="5" font-weight="700" fill="#78350f">SDG</text>
  </g>

  <!-- ── Bottom branding ── -->
  <line x1="32" y1="250" x2="132" y2="250" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>

  <text x="82" y="264" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="7.5" fill="#94a3b8">نظام نقاط البيع التجاري</text>

  <text x="82" y="278" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="8" font-weight="600" fill="#2563eb">v1.0.0</text>

  <line x1="32" y1="286" x2="132" y2="286" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>

  <text x="82" y="299" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="7" fill="#475569">Elmahdi Dev</text>
  <text x="82" y="310" text-anchor="middle" font-family="Segoe UI,Tahoma,Arial,sans-serif"
        font-size="6.5" fill="#334155">almhdy24.com</text>
</svg>
